{% extends "base.html" %}

{% block title %}Poista postaus{% endblock %}

{% block content %}
    <h1>Poista postaus</h1>
    
    <div style="background-color: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 3px; margin-bottom: 20px;">
        <p><strong>⚠️ Varoitus:</strong> Olet poistamassa seuraavaa postausta:</p>
        <h2>{{ object.title }}</h2>
        <p>{{ object.content|truncatewords:20 }}</p>
    </div>
    
    <form method="POST" style="display: inline;">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc3545;">Kyllä, poista postaus</button>
        <a href="{% url 'post-list' %}" class="btn" style="background-color: #6c757d;">Peruuta</a>
    </form>
{% endblock %}
